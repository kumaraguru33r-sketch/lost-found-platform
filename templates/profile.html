{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="container"><div class="row g-4">
  <div class="col-lg-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h4>Your profile</h4>
      <p class="small text-muted">{{ stats.reports }} reports · {{ stats.returned }} returned · member since {{ current_user.created_at.strftime('%b %Y') }}</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="details">
        <div class="mb-3"><label class="form-label">Username</label>
          <input name="username" class="form-control" required value="{{ current_user.username }}"></div>
        <div class="mb-3"><label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required value="{{ current_user.email }}"></div>
        <div class="mb-3"><label class="form-label">Phone <span class="text-muted">(private)</span></label>
          <input name="phone" class="form-control" value="{{ current_user.phone or '' }}"></div>
        <button class="btn btn-primary">Save profile</button>
      </form>
    </div></div>
  </div>
  <div class="col-lg-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h4>Change password</h4>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="password">
        <div class="mb-3"><label class="form-label">Current password</label><input type="password" name="current" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">New password</label><input type="password" name="new" class="form-control" required minlength="8"></div>
        <div class="mb-3"><label class="form-label">Confirm new password</label><input type="password" name="confirm" class="form-control" required></div>
        <button class="btn btn-outline-primary">Update password</button>
      </form>
    </div></div>
  </div>
</div></div>
{% endblock %}
