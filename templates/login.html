{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Welcome back</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Username or email</label>
        <input name="identifier" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center small mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div></div>
</div></div></div>
{% endblock %}
